<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperçu — CV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside id="sidebar">
    <div class="profile-header" id="profile-header"></div>
    <div class="contact-info" id="contact-info"></div>

    <nav class="view-nav">
      <button class="view-btn active" data-view="timeline">
        <span class="vi">↓</span> Chronologique
      </button>
      <button class="view-btn" data-view="milieux">
        <span class="vi">◈</span> Par milieu
      </button>
      <button class="view-btn" data-view="competences">
        <span class="vi">◇</span> Par compétence
      </button>
    </nav>

    <div id="sidebar-filters"></div>

    <div class="sidebar-footer">
      <p class="langues-title">Langues</p>
      <div id="langue-list"></div>
    </div>
  </aside>

  <main id="main">
    <div id="view-header"></div>
    <div id="content"></div>
  </main>

  <script>
    // Aperçu utilisé par editor.html : lit le brouillon depuis localStorage
    // (sauvegardé en continu par l'éditeur, clé "cvEditorDraft") au lieu de
    // js/data.js — indépendant de la relation onglet-ouvreur (contrairement
    // à sessionStorage + window.open, peu fiable selon navigateur/bloqueur
    // de popup). Si absent/invalide, window.CV reste undefined —
    // js/validate.js + js/app.js affichent alors l'écran d'erreur standard.
    try {
      const raw = localStorage.getItem('cvEditorDraft');
      if (raw) window.CV = JSON.parse(raw);
    } catch (e) { /* CV reste undefined, géré par l'écran de validation */ }
  </script>
  <script src="js/validate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
