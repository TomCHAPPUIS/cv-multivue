<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside id="sidebar">
    <div class="profile-header" id="profile-header"></div>

    <div class="contact-info" id="contact-info"></div>

    <nav class="view-nav">
      <button class="view-btn active" data-view="timeline">
        <span class="vi">↓</span> Chronologique
      </button>
      <button class="view-btn" data-view="domaines">
        <span class="vi">◈</span> Par domaine
      </button>
      <button class="view-btn" data-view="competences">
        <span class="vi">◇</span> Par compétence
      </button>
    </nav>

    <div id="sidebar-filters"></div>

    <div class="sidebar-footer">
      <p class="langues-title">Langues</p>
      <div id="langue-list"></div>
    </div>
  </aside>

  <main id="main">
    <div id="view-header"></div>
    <div id="content"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
