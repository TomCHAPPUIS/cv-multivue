<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV</title>
  <meta name="description" content="CV personnel interactif — navigable par ordre chronologique, par milieu ou par compétence.">

  <!--
    Aperçu de partage (réseaux sociaux, messagerie) : les robots qui
    génèrent ces aperçus n'exécutent pas JavaScript, donc ces balises ne
    peuvent pas se remplir automatiquement depuis js/data.js. Si vous
    voulez un aperçu personnalisé avec votre nom, éditez les lignes
    ci-dessous à la main après avoir rempli data.js.
  -->
  <meta property="og:type" content="profile">
  <meta property="og:title" content="CV">
  <meta property="og:description" content="CV personnel interactif — navigable par ordre chronologique, par milieu ou par compétence.">
  <meta name="twitter:card" content="summary">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside id="sidebar">
    <div class="profile-header" id="profile-header"></div>

    <div class="contact-info" id="contact-info"></div>

    <nav class="view-nav">
      <button class="view-btn active" data-view="timeline">
        <span class="vi">↓</span> Chronologique
      </button>
      <button class="view-btn" data-view="milieux">
        <span class="vi">◈</span> Par milieu
      </button>
      <button class="view-btn" data-view="competences">
        <span class="vi">◇</span> Par compétence
      </button>
      <button class="view-btn" id="btn-print">
        <span class="vi">⎙</span> Imprimer / PDF
      </button>
    </nav>

    <div id="sidebar-filters"></div>

    <div class="sidebar-footer">
      <p class="langues-title">Langues</p>
      <div id="langue-list"></div>
    </div>
  </aside>

  <main id="main">
    <div id="view-header"></div>
    <div id="content"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
